name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: write
    with:
      runs-on: windows-latest
      artifact: xmljson-viewer-windows-x86_64

  linux:
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: write
    with:
      runs-on: ubuntu-latest
      artifact: xmljson-viewer-linux-x86_64
      check-format: true

  macos:
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: write
    with:
      runs-on: macos-latest
      artifact: xmljson-viewer-macos-arm64
