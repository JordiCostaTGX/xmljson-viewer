name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: xmljson-viewer-windows-x86_64
          - os: ubuntu-latest
            artifact: xmljson-viewer-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/xmljson-viewer.exe, README.md, resources/icon-provenance.txt $dir
          Compress-Archive -Path $dir -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          dir="dist/${{ matrix.artifact }}"
          mkdir -p "$dir/bin" "$dir/resources"
          cp target/release/xmljson-viewer "$dir/bin/"
          cp README.md install.sh xmljson-viewer.desktop "$dir/"
          cp resources/visor-mascot.png resources/icon-provenance.txt "$dir/resources/"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package (macOS)
        run: |
          dir="dist/xmljson-viewer-macos-arm64"
          mkdir -p "$dir/bin" "$dir/resources"
          cp target/release/xmljson-viewer "$dir/bin/"
          cp README.md install.sh xmljson-viewer.desktop "$dir/"
          cp resources/visor-mascot.png resources/icon-provenance.txt "$dir/resources/"
          tar -C dist -czf "dist/xmljson-viewer-macos-arm64.tar.gz" "xmljson-viewer-macos-arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: xmljson-viewer-macos-arm64
          path: dist/xmljson-viewer-macos-arm64.tar.gz

  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xmljson-viewer-*-x86_64
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes

  release-macos:
    needs: [build-macos, release]
    if: ${{ !cancelled() && needs.build-macos.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xmljson-viewer-macos-arm64
          path: dist

      - name: Attach macOS package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
