[package]
name = "xmljson-viewer"
version = "1.1.2"
edition = "2024"
description = "Cross-platform XML/JSON editor with a lazy tree"
include = [
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/install.sh",
    "/build.rs", "/xmljson-viewer.desktop", "/src/*.rs",
    "/resources/icon-provenance.txt", "/resources/visor-mascot.png",
    "/tools/*.py",
]

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
log = "0.4"
rfd = "0.18"
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
quick-xml = "0.37"
serde = "1"
serde_json = "1"
html-escape = "0.2"
regex = "1"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = 0
