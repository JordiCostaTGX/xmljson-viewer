[package]
name = "xmljson-viewer-rust"
version = "0.1.0"
edition = "2024"
description = "Cross-platform XML/JSON editor with a lazy tree"
include = [
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/install.sh",
    "/xmljson-viewer-rust.desktop", "/src/*.rs",
    "/resources/icon-provenance.txt", "/resources/visor-mascot.png",
    "/tools/*.py",
]

[dependencies]
eframe = "0.37"
rfd = "0.18"
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
quick-xml = "0.37"
serde = "1"
serde_json = "1"
html-escape = "0.2"
regex = "1"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = 0
